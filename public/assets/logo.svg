<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background: Clean Indigo Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#cleanGrad)" />
  
  <!-- Minimalist Inner Border (White, semitransparent) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8" />

  <!-- Monogram: HL -->
  <!-- Using standard Sans-Serif for reliability, with elegant spacing -->
  <text x="50%" y="54%" dy=".1em" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="bold" 
        font-size="220" 
        fill="#ffffff" 
        letter-spacing="10">
    H L
  </text>
</svg>
